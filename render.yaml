# Render.com blueprint: one web service + a persistent disk for SQLite and uploads.
services:
  - type: web
    name: nikhilsolomon-com
    runtime: node
    plan: starter            # persistent disks need a paid instance ($7/mo); free tier has no disk
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        value: https://nikhilsolomon.com
      - key: SESSION_SECRET
        generateValue: true
      - key: CONTACT_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
